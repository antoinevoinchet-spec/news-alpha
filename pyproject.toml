[project]
name = "news-alpha"
version = "0.1.0"
description = "Pre-registered test: SEC 8-K filings, LLM score, abnormal returns against IWM (see SPEC.md)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
